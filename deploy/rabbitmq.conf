# Configuración de RabbitMQ para docker-compose.prod.yml (#61).
# RabbitMQ calcula su umbral de memoria sobre la RAM de la MÁQUINA, no sobre el límite del contenedor: con
# `mem_limit: 512m` el kernel lo mataría (OOM) antes de que su alarma frenase a los productores. Un umbral absoluto
# inferior al límite hace que, al llenarse, RabbitMQ bloquee las publicaciones (el outbox las retiene) en vez de morir.
vm_memory_high_watermark.absolute = 384MiB
