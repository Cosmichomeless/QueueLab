# Infraestructura desechable de las pruebas e2e del dashboard (ver docs/e2e-dashboard.md).
# Proyecto, puertos y credenciales propios (en 127.0.0.1) para no chocar con el docker-compose.yml de desarrollo,
# y sin volúmenes: `down -v` al terminar no deja nada. Redis no hace falta: las e2e desactivan el límite de envíos.
name: queuelab-e2e

services:
  postgres:
    image: postgres:18-alpine
    environment:
      POSTGRES_DB: queuelab
      POSTGRES_USER: queuelab
      POSTGRES_PASSWORD: queuelab-e2e
    ports:
      - "127.0.0.1:15441:5432"
    tmpfs:
      - /var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U queuelab -d queuelab"]
      interval: 2s
      timeout: 3s
      retries: 30

  rabbitmq:
    image: rabbitmq:4-alpine
    environment:
      RABBITMQ_DEFAULT_USER: queuelab
      RABBITMQ_DEFAULT_PASS: queuelab-e2e
    ports:
      - "127.0.0.1:15673:5672"
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 3s
      timeout: 5s
      retries: 30
