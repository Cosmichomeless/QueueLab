# Los tests de la API no tienen RabbitMQ salvo los del despachador, que lo llaman a mano.
queuelab.outbox.dispatch.enabled=false
# Los tests no ensucian el árbol de trabajo: los ficheros van a target/.
queuelab.storage.directory=target/test-storage
# Sin Redis salvo en las pruebas del límite de envíos, que lo activan y levantan uno real.
queuelab.rate-limit.enabled=false
# El refresco de métricas se desactiva en tests: se invoca a mano con refresh() para que sea determinista.
queuelab.metrics.refresh.enabled=false
