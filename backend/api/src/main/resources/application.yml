spring:
  application:
    name: queuelab-api
  servlet:
    multipart:
      max-file-size: ${queuelab.csv.max-file-size}
      # Algo mayor que el fichero: deja sitio a las cabeceras de la parte y a campos accesorios.
      max-request-size: 11MB
  datasource:
    url: ${QUEUELAB_DB_URL:jdbc:postgresql://localhost:5434/queuelab}
    username: ${QUEUELAB_DB_USER:queuelab}
    password: ${QUEUELAB_DB_PASSWORD:}
  rabbitmq:
    host: ${QUEUELAB_RABBITMQ_HOST:localhost}
    port: ${QUEUELAB_RABBITMQ_PORT:5672}
    username: ${QUEUELAB_RABBITMQ_USER:queuelab}
    password: ${QUEUELAB_RABBITMQ_PASSWORD:}
    # Sin conexión no hay que esperar el timeout por defecto (60 s) en cada reintento del outbox.
    connection-timeout: 5s
    # El broker confirma cada publicación y devuelve las no enrutables: base del despachador del outbox.
    publisher-confirm-type: correlated
    publisher-returns: true
    template:
      mandatory: true
  data:
    redis:
      host: ${QUEUELAB_REDIS_HOST:localhost}
      port: ${QUEUELAB_REDIS_PORT:6379}
      password: ${QUEUELAB_REDIS_PASSWORD:}
      # Redis solo guarda contadores de cuota: si no responde, la API prefiere dejar pasar la petición antes que
      # esperar (ver «Límite de envíos» en backend/README.md).
      timeout: 500ms
      connect-timeout: 500ms

queuelab:
  jobs:
    # Tipos de trabajo que acepta POST /api/v1/jobs: solo los que el worker sabe ejecutar.
    # Añadir un tipo aquí sin su ejecutor lo dejaría aceptado pero sin procesar.
    types: noop,csv-import
  outbox:
    dispatch:
      interval: 1s
    batch-size: 50
    confirm-timeout: 5s

  backpressure:
    # Contrapresión: con tantos trabajos esperando worker (QUEUED o RETRYING) los envíos nuevos se rechazan con 503
    # y Retry-After en lugar de dejar crecer la cola. Ver backend/README.md, «Contrapresión».
    max-pending: ${QUEUELAB_BACKPRESSURE_MAX_PENDING:1000}
    retry-after: ${QUEUELAB_BACKPRESSURE_RETRY_AFTER:30s}

  rate-limit:
    # Cuota de envíos por cliente (IP remota), compartida entre instancias de la API a través de Redis.
    # Ver backend/README.md, «Límite de envíos».
    enabled: ${QUEUELAB_RATE_LIMIT_ENABLED:true}
    max-requests: ${QUEUELAB_RATE_LIMIT_MAX_REQUESTS:60}
    window: ${QUEUELAB_RATE_LIMIT_WINDOW:1m}

  cors:
    # Orígenes del dashboard que pueden llamar a la API desde el navegador (separados por comas; vacío = ninguno).
    allowed-origins: ${QUEUELAB_CORS_ALLOWED_ORIGINS:http://localhost:3000}

  csv:
    # Tamaño máximo del CSV subido (ver docs/csv-workload.md). Se aplica dos veces: el límite de multipart corta
    # la subida en el contenedor y el servicio la vuelve a comprobar.
    max-file-size: 10MB

management:
  health:
    rabbit:
      # La API acepta trabajos aunque RabbitMQ esté caído (el outbox los conserva): no afecta a su salud.
      enabled: false
    redis:
      # Sin Redis no hay límite de envíos (se deja pasar), pero la API sigue aceptando trabajos: no afecta a su salud.
      enabled: false
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true
