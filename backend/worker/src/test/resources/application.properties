# Los tests de configuración no tienen RabbitMQ: el consumidor solo arranca en los que lo piden.
spring.rabbitmq.listener.simple.auto-startup=false
# El recuperador periódico se desactiva en tests: se invoca a mano con recoverOnce() para que sea determinista.
queuelab.worker.recovery.enabled=false
# Los tests no ensucian el árbol de trabajo: los ficheros van a target/.
queuelab.storage.directory=target/test-storage
# La limpieza periódica también se desactiva en tests: se invoca a mano con cleanOnce().
queuelab.cleanup.enabled=false
# Puerto libre aleatorio para el endpoint de métricas: los tests no pueden chocar entre sí ni con otros procesos.
queuelab.metrics.port=0
