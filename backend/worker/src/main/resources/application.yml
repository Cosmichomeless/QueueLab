spring:
  application:
    name: queuelab-worker
  datasource:
    url: ${QUEUELAB_DB_URL:jdbc:postgresql://localhost:5434/queuelab}
    username: ${QUEUELAB_DB_USER:queuelab}
    password: ${QUEUELAB_DB_PASSWORD:}
  rabbitmq:
    host: ${QUEUELAB_RABBITMQ_HOST:localhost}
    port: ${QUEUELAB_RABBITMQ_PORT:5672}
    username: ${QUEUELAB_RABBITMQ_USER:queuelab}
    password: ${QUEUELAB_RABBITMQ_PASSWORD:}
    listener:
      simple:
        # Un mensaje cuyo procesamiento falla se rechaza hacia la DLQ en vez de reencolarse en bucle.
        default-requeue-rejected: false
  main:
    # El worker no expone HTTP: es un proceso de fondo que consume mensajes.
    web-application-type: none
    # Mantiene viva la JVM aunque aún no haya consumidores registrados.
    keep-alive: true

logging:
  # QUEUELAB_LOG_FORMAT=logstash (o ecs) emite el log como una línea JSON con el MDC (correlationId, jobId);
  # vacío, texto legible con el id de correlación y el del trabajo tras el nivel.
  structured:
    format:
      console: ${QUEUELAB_LOG_FORMAT:}
  pattern:
    correlation: "[%X{correlationId:-}] [%X{jobId:-}] "
